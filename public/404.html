<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found | Multicore Management</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#06101e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:520px}
.code{font-family:'Montserrat',sans-serif;font-weight:800;font-size:5rem;color:#1c99e1;line-height:1}
h1{font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.5rem;margin:16px 0 12px}
p{color:#8fa1b8;line-height:1.7;margin-bottom:28px}
.btn{display:inline-block;padding:14px 32px;border-radius:50px;background:#f68712;color:#fff;font-family:'Montserrat',sans-serif;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="wrap">
<div class="code">404</div>
<h1>That page does not exist</h1>
<p>The page you are looking for has moved or never existed. Head back to the homepage and we will get you sorted.</p>
<a class="btn" href="/">Back to Homepage</a>
</div>
</body>
</html>
